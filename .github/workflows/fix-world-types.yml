name: Fix living world type boundaries

on:
  push:
    branches:
      - agent/complete-living-football-world

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-living-football-world
          fetch-depth: 0
      - name: Apply exact type-boundary corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
            'src/audio/AudioProvider.tsx': [
              ("const setWeather = useCallback((weather: Weather, intensity: number) => engine.setWeather(weather, intensity), [engine])", "const setWeather = useCallback((weather: Weather, intensity: number) => engine.setWeather(weather === 'rain' || weather === 'wind' || weather === 'overcast' ? weather : 'clear', intensity), [engine])"),
            ],
            'src/audio/useFootballAudio.ts': [
              ("const setWeather = useCallback((weather: Weather, intensity: number) => engine.setWeather(weather, intensity), [engine])", "const setWeather = useCallback((weather: Weather, intensity: number) => engine.setWeather(weather === 'rain' || weather === 'wind' || weather === 'overcast' ? weather : 'clear', intensity), [engine])"),
            ],
            'src/components/MatchView.tsx': [
              ("derby: worldSelection.importance === 'derby'", "derby: worldSelection.importance === 'derby' ? 1 : 0"),
            ],
          }
          for name, changes in replacements.items():
              path = Path(name)
              text = path.read_text()
              for old, new in changes:
                  if old not in text:
                      raise SystemExit(f'missing expected token in {name}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          rm .github/workflows/fix-world-types.yml
      - name: Commit corrected source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix living world integration types"
          git push origin HEAD:agent/complete-living-football-world
