name: Recover pending football updates

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: recover-pending-football-updates
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'MahirG/Ethiopia-Football-Universe-' && github.head_ref == 'agent/trigger-pending-recovery'
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild completed updates on current main
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B agent/recovered-pending-updates origin/main

          core_base="$(git merge-base origin/main origin/agent/aaa-core-match-gameplay-engine)"
          git diff --binary "${core_base}"..origin/agent/aaa-core-match-gameplay-engine > /tmp/core-engine.patch
          git apply --3way --index /tmp/core-engine.patch || true

          # Preserve the current Phase 5 + realistic-player runtime while integrating the core engine as an authoritative shadow/audit layer.
          git checkout --ours package.json src/game/MatchScene.tsx
          python <<'PY'
          import json
          from pathlib import Path

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          scripts = package.setdefault('scripts', {})
          scripts['core:validate'] = 'node scripts/core-validate.mjs'
          build = scripts.get('build', '')
          if 'npm run core:validate' not in build:
              scripts['build'] = f'npm run core:validate && {build}'
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          path = Path('src/game/MatchScene.tsx')
          text = path.read_text()
          text = text.replace(
              "import { FORMATION, HALF_LENGTH, PLAYER_HEIGHT } from './config'",
              "import { BALL_RADIUS, FORMATION, HALF_LENGTH, PLAYER_HEIGHT } from './config'",
          )
          marker = "import type { CompetitiveMatchState, Phase5BallContact, Phase5FoulContact } from '../phase5/types'\n"
          addition = marker + "import { CoreMatchGameplayEngine } from '../core/engine'\nimport type { CorePlayerSnapshot } from '../core/types'\n"
          if "../core/engine" not in text:
              text = text.replace(marker, addition)
          text = text.replace(
              "  director: CompetitiveMatchDirector\n  setCompetitiveState: (state: CompetitiveMatchState) => void\n",
              "  director: CompetitiveMatchDirector\n  coreEngine: CoreMatchGameplayEngine\n  setCompetitiveState: (state: CompetitiveMatchState) => void\n",
          )
          text = text.replace(
              "function Runtime({ ballRef, controlledPosition, scoreGoal, onTelemetry, weather, weatherIntensity, matchProgress, humanWorld, director, setCompetitiveState, ...props }: RuntimeProps) {",
              "function Runtime({ ballRef, controlledPosition, scoreGoal, onTelemetry, weather, weatherIntensity, matchProgress, humanWorld, director, coreEngine, setCompetitiveState, ...props }: RuntimeProps) {",
          )
          ref_marker = "  const lastCollisionFoul = useRef(0)\n"
          if 'lastCoreTouchPlayerId' not in text:
              text = text.replace(ref_marker, ref_marker + "  const lastCoreTouchPlayerId = useRef<string | null>(null)\n  const lastCoreTouchTeam = useRef<TeamSide | null>(null)\n")
          insertion_marker = "    ballPosition.set(position.x, position.y, position.z)\n    ballVelocity.set(velocity.x, velocity.y, velocity.z)\n"
          core_block = insertion_marker + "\n    const touchingPlayer = humanWorld.world.players.find((player) => player.onBall)\n    if (touchingPlayer) {\n      lastCoreTouchPlayerId.current = touchingPlayer.id\n      lastCoreTouchTeam.current = touchingPlayer.team\n    }\n    const corePlayers = humanWorld.world.players.flatMap<CorePlayerSnapshot>((player) => {\n      const profile = humanWorld.profiles.get(player.id)\n      if (!profile) return []\n      return [{\n        id: player.id,\n        team: player.team,\n        index: player.index,\n        role: player.role,\n        position: player.position,\n        velocity: player.velocity,\n        facing: player.facing,\n        fatigue: player.physical.fatigue,\n        balance: player.physical.balance,\n        strength: profile.ability.strength,\n        awareness: (profile.ability.vision + profile.ability.reactions) / 2,\n        discipline: profile.personality.discipline,\n        reaction: profile.ability.reactions,\n        onBall: player.onBall,\n        action: player.action,\n      }]\n    })\n    const coreWindStrength = (weather === 'wind' || weather === 'storm') ? weatherIntensity * props.world.telemetry.windExposure : 0\n    const coreResult = coreEngine.tick({\n      delta,\n      simulationTime: state.clock.elapsedTime,\n      matchMinute: props.matchMinute,\n      running: props.running,\n      scoreHome: props.scoreHome,\n      scoreAway: props.scoreAway,\n      weather,\n      weatherIntensity,\n      ball: {\n        position,\n        velocity,\n        angularVelocity,\n        radius: BALL_RADIUS,\n        lastTouchPlayerId: lastCoreTouchPlayerId.current,\n        lastTouchTeam: lastCoreTouchTeam.current,\n      },\n      players: corePlayers,\n      surface: {\n        grip: props.world.pitch.grip,\n        rollingResistance: props.world.pitch.rollingResistance,\n        restitution: props.world.pitch.bounce,\n        wetness: props.world.pitch.moisture,\n        unevenness: props.world.pitch.divots,\n        altitudeMeters: props.world.venue.altitudeM,\n        temperatureC: props.world.pitch.temperatureC,\n        wind: { x: coreWindStrength * 0.35, y: 0, z: coreWindStrength },\n      },\n    })\n    ball.applyImpulse({\n      x: coreResult.environmentalAcceleration.x * delta,\n      y: coreResult.environmentalAcceleration.y * delta,\n      z: coreResult.environmentalAcceleration.z * delta,\n    }, true)\n"
          if 'const coreResult = coreEngine.tick' not in text:
              text = text.replace(insertion_marker, core_block)
          telemetry_old = "onTelemetry({ homeTerritory: Math.round(home), awayTerritory: Math.round(100 - home), ballSpeed: Math.round(Math.hypot(velocity.x, velocity.y, velocity.z) * 36) / 10, controlledDistance: Math.round(distance.current * 10) / 10, stamina: Math.round((1 - (controlledRuntime?.physical.fatigue ?? matchProgress * 0.5)) * 100) })"
          telemetry_new = "onTelemetry({ homeTerritory: Math.round(home), awayTerritory: Math.round(100 - home), ballSpeed: Math.round(Math.hypot(velocity.x, velocity.y, velocity.z) * 36) / 10, controlledDistance: Math.round(distance.current * 10) / 10, stamina: Math.round((1 - (controlledRuntime?.physical.fatigue ?? matchProgress * 0.5)) * 100), core: coreResult.telemetry })"
          text = text.replace(telemetry_old, telemetry_new)
          director_marker = "  const directorRef = useRef<CompetitiveMatchDirector | null>(null)\n"
          if 'coreEngineRef' not in text:
              text = text.replace(director_marker, director_marker + "  const coreEngineRef = useRef<CoreMatchGameplayEngine | null>(null)\n")
              text = text.replace(
                  "  if (!directorRef.current) directorRef.current = new CompetitiveMatchDirector(competitiveSettings)\n",
                  "  if (!directorRef.current) directorRef.current = new CompetitiveMatchDirector(competitiveSettings)\n  if (!coreEngineRef.current) coreEngineRef.current = new CoreMatchGameplayEngine()\n",
              )
              text = text.replace(
                  "  const director = directorRef.current\n",
                  "  const director = directorRef.current\n  const coreEngine = coreEngineRef.current\n",
              )
          text = text.replace(
              "humanWorld={humanWorld} director={director} setCompetitiveState={setCompetitiveState}",
              "humanWorld={humanWorld} director={director} coreEngine={coreEngine} setCompetitiveState={setCompetitiveState}",
          )
          path.write_text(text)
          PY
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m 'Integrate authoritative core match engine'

          phase6_base="$(git merge-base origin/main origin/agent/phase-6-connected-platform)"
          git diff --binary "${phase6_base}"..origin/agent/phase-6-connected-platform > /tmp/phase6.patch
          git apply --3way --index /tmp/phase6.patch || true
          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -n "$conflicts" ]; then
            echo "$conflicts"
            for file in $conflicts; do
              if [ "$file" = 'package.json' ]; then
                git checkout --ours "$file"
                git add "$file"
              else
                echo "Unresolved Phase 6 conflict: $file" >&2
                exit 1
              fi
            done
          fi
          git commit -m 'Integrate Phase 6 connected football platform'

          git rm .github/workflows/recover-pending-updates.yml
          git commit -m 'Remove temporary recovery workflow'

      - name: Install dependencies
        run: npm ci

      - name: Validate recovered source
        run: |
          npm run lint
          npm run build

      - name: Push recovered branch
        shell: bash
        run: |
          git push --force-with-lease origin HEAD:agent/recovered-pending-updates
