name: Static production artifact

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-static-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: efu-static-production
          path: dist
          if-no-files-found: error
          retention-days: 1
      - name: Verify GitHub Pages release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 12 --retry-delay 10 --retry-all-errors \
            https://mahirg.github.io/Ethiopia-Football-Universe-/deployment.json \
            --output /tmp/pages-deployment.json
          cat /tmp/pages-deployment.json
          grep -q 'ed7a861983cb60b3f82c2ac9e3d865b3bc9050c0' /tmp/pages-deployment.json
          curl --fail --location --retry 5 --retry-delay 5 \
            https://mahirg.github.io/Ethiopia-Football-Universe-/ \
            --output /tmp/pages-index.html
          grep -q '<div id="root"></div>' /tmp/pages-index.html
