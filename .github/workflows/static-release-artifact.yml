name: Verify successful living world deployment

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployment root and release marker
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ethiopia-football-universe-bidwmeomd-gulitshop.vercel.app'
          curl --silent --show-error --location --output /tmp/index.html --write-out 'ROOT_STATUS=%{http_code}\n' "$BASE/"
          head -c 500 /tmp/index.html
          echo
          curl --silent --show-error --location --output /tmp/deployment.json --write-out 'MARKER_STATUS=%{http_code}\n' "$BASE/deployment.json"
          cat /tmp/deployment.json
          grep -q '<div id="root"></div>' /tmp/index.html
          grep -q 'ed7a861983cb60b3f82c2ac9e3d865b3bc9050c0' /tmp/deployment.json
