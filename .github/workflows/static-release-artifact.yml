name: Static production artifact

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-static-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: efu-static-production
          path: dist
          if-no-files-found: error
          retention-days: 1
