name: Recover successful deployment URL

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  deployments: read

jobs:
  recover-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Read deployment records for living world release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api 'repos/MahirG/Ethiopia-Football-Universe-/deployments?sha=ed7a861983cb60b3f82c2ac9e3d865b3bc9050c0&per_page=100' > /tmp/deployments.json
          python3 - <<'PY'
          import json
          deployments=json.load(open('/tmp/deployments.json'))
          print(f'DEPLOYMENT_COUNT={len(deployments)}')
          for deployment in deployments:
              print(json.dumps({
                  'id': deployment['id'],
                  'environment': deployment.get('environment'),
                  'description': deployment.get('description'),
                  'task': deployment.get('task'),
                  'created_at': deployment.get('created_at'),
                  'statuses_url': deployment.get('statuses_url'),
                  'payload': deployment.get('payload'),
              }))
          PY
          python3 - <<'PY' > /tmp/deployment-ids.txt
          import json
          for deployment in json.load(open('/tmp/deployments.json')):
              print(deployment['id'])
          PY
          while read -r DEPLOYMENT_ID; do
            echo "--- deployment $DEPLOYMENT_ID statuses ---"
            gh api "repos/MahirG/Ethiopia-Football-Universe-/deployments/$DEPLOYMENT_ID/statuses?per_page=100" || true
          done < /tmp/deployment-ids.txt
