name: Diagnose GitHub Pages deployment

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  diagnose-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Read Pages workflow state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api 'repos/MahirG/Ethiopia-Football-Universe-/actions/workflows/pages.yml/runs?branch=main&per_page=5' > /tmp/pages-runs.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/pages-runs.json'))
          for run in data.get('workflow_runs', []):
              print(json.dumps({
                  'id': run['id'],
                  'status': run['status'],
                  'conclusion': run['conclusion'],
                  'head_sha': run['head_sha'],
                  'event': run['event'],
                  'url': run['html_url'],
              }))
          if data.get('workflow_runs'):
              print(f"LATEST_RUN_ID={data['workflow_runs'][0]['id']}")
          PY
          RUN_ID=$(python3 - <<'PY'
          import json
          data=json.load(open('/tmp/pages-runs.json'))
          print(data['workflow_runs'][0]['id'])
          PY
          )
          gh api "repos/MahirG/Ethiopia-Football-Universe-/actions/runs/$RUN_ID/jobs" > /tmp/pages-jobs.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/pages-jobs.json'))
          for job in data.get('jobs', []):
              print(json.dumps({
                  'id': job['id'],
                  'name': job['name'],
                  'status': job['status'],
                  'conclusion': job['conclusion'],
                  'steps': [{s['name']: s['conclusion']} for s in job.get('steps', [])],
              }))
          PY
