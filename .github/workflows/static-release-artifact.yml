name: Verify public living world release

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-pages-release:
    runs-on: ubuntu-latest
    steps:
      - name: Verify GitHub Pages release marker and app root
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 24 --retry-delay 10 --retry-all-errors \
            https://mahirg.github.io/Ethiopia-Football-Universe-/deployment.json \
            --output /tmp/pages-deployment.json
          cat /tmp/pages-deployment.json
          grep -q 'ed7a861983cb60b3f82c2ac9e3d865b3bc9050c0' /tmp/pages-deployment.json
          curl --fail --location --retry 8 --retry-delay 5 --retry-all-errors \
            https://mahirg.github.io/Ethiopia-Football-Universe-/ \
            --output /tmp/pages-index.html
          grep -q '<div id="root"></div>' /tmp/pages-index.html
