name: Execute universal controls finalizer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: execute-universal-controls-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.head_ref == 'agent/universal-football-controls-clean'
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/universal-football-controls-clean
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute checked-in finalizer
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/finalize-universal-controls.yml')
          lines = path.read_text().splitlines()
          start = None
          for index, line in enumerate(lines):
              if line.strip() == '- name: Recover and integrate universal controls':
                  for cursor in range(index + 1, len(lines)):
                      if lines[cursor].strip() == 'run: |':
                          start = cursor + 1
                          break
                  break
          if start is None:
              raise SystemExit('Finalizer integration step was not found')
          body = []
          for line in lines[start:]:
              if line.startswith('      - name:'):
                  break
              body.append(line[10:] if line.startswith('          ') else line)

          for index, line in enumerate(body):
              if 'MatchView touch overlay' not in line:
                  continue
              indent = line[:len(line) - len(line.lstrip())]
              body[index:index + 1] = [
                  f'{indent}text, count = re.subn(',
                  f'{indent}    r\'        <div className="game-controls-overlay">.*?        </div>\\n      </section>\',',
                  f'{indent}    "        <UniversalControlsOverlay enabled={{running && !replayActive && presentationPhase === \'live\'}} />\\n      </section>",',
                  f'{indent}    text,',
                  f'{indent}    count=1,',
                  f'{indent}    flags=re.S,',
                  f'{indent})',
                  f'{indent}if count != 1:',
                  f"{indent}    raise RuntimeError('Unable to replace MatchView touch overlay')",
              ]
              break

          Path('/tmp/finalize-universal-controls.sh').write_text('\n'.join(body) + '\n')
          PY
          bash /tmp/finalize-universal-controls.sh

      - name: Repair recovered syntax and hook dependencies
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          input_path = Path('src/input/useUniversalInput.ts')
          input_text = input_path.read_text()
          input_text = input_text.replace(
              "if (!gamepadPrevious.current.has(action) transientPressed.current.add(action)",
              "if (!gamepadPrevious.current.has(action)) transientPressed.current.add(action)",
          )
          input_text = input_text.replace(
              "if (!gamepadHeld.has(action) transientReleased.current.add(action)",
              "if (!gamepadHeld.has(action)) transientReleased.current.add(action)",
          )
          input_path.write_text(input_text)

          scene_path = Path('src/game/MatchScene.tsx')
          scene_text = scene_path.read_text()
          scene_text = scene_text.replace(
              "  const [competitiveState, setCompetitiveState] = useState(() => director.snapshot())\n  useEffect(() => director.updateSettings(competitiveSettings), [director, competitiveSettings])",
              "  const [competitiveState, setCompetitiveState] = useState(() => director.snapshot())\n  const onEvent = props.onEvent\n  useEffect(() => director.updateSettings(competitiveSettings), [director, competitiveSettings])",
              1,
          )
          scene_text = scene_text.replace(
              "            props.onEvent(`Manual player switch · #${candidates[0].index + 1}`)",
              "            onEvent(`Manual player switch · #${candidates[0].index + 1}`)",
              1,
          )
          scene_text = scene_text.replace(
              "  }, [controlledIndex, controls, humanWorld, props.onEvent])",
              "  }, [controlledIndex, controls, humanWorld, onEvent])",
              1,
          )
          scene_path.write_text(scene_text)
          PY

      - name: Install dependencies
        run: npm install

      - name: Validate universal controls and full game
        run: |
          npm run input:validate
          npm run audio:validate
          npm run human:validate
          npm run world:validate
          npm run lint
          npm run build

      - name: Commit validated controls
        shell: bash
        run: |
          rm -f .github/workflows/run-finalizer-from-pr.yml .github/finalizer-trigger.txt
          git add -A
          git commit -m 'Integrate universal cross-device football controls'
          git push origin HEAD:agent/universal-football-controls-clean
