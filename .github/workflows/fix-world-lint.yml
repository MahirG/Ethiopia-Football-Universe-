name: Fix living world lint

on:
  push:
    branches:
      - agent/complete-living-football-world

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-living-football-world
          fetch-depth: 0
      - name: Apply exact lint corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
            'src/components/MatchView.tsx': [
              ("}), [awayId, homeId, humanTelemetry.footSlipEvents", "}), [humanTelemetry.footSlipEvents"),
            ],
            'src/game/Stadium.tsx': [
              ("}, [awayColor, awaySection, awayShare", "}, [awayColor, awayShare"),
            ],
            'src/world/WorldLayer.tsx': [
              ("import { useEffect, useLayoutEffect, useMemo, useRef } from 'react'", "import { useEffect, useMemo, useRef } from 'react'"),
            ],
            'src/world/engine.ts': [
              ("  const importance = importanceWeight[context.selection.importance]\n  const tension", "  const tension"),
            ],
            'src/world/types.ts': [
              ("PresentationPhase, QualityLevel, TeamSide, TimeOfDay", "PresentationPhase, QualityLevel, TimeOfDay"),
            ],
          }
          for name, changes in replacements.items():
              path = Path(name)
              text = path.read_text()
              for old, new in changes:
                  if old not in text:
                      raise SystemExit(f'missing expected token in {name}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          rm .github/workflows/fix-world-lint.yml
      - name: Commit corrected source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix living world lint boundaries"
          git push origin HEAD:agent/complete-living-football-world
