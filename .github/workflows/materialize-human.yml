name: Materialize human simulation

on:
  push:
    branches:
      - agent/complete-human-player-simulation
    paths:
      - '.github/human-payload.part-*'
      - '.github/workflows/materialize-human.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-human-player-simulation
          fetch-depth: 0
      - name: Expand validated source
        shell: bash
        run: |
          cat .github/human-payload.part-* > /tmp/human-upgrade.tar.gz
          echo "9cb9ebd97691b0e52f026e714fafb2f094d3f989819fa5a29f72ea28bd111976  /tmp/human-upgrade.tar.gz" | sha256sum -c -
          tar -xzf /tmp/human-upgrade.tar.gz
          rm -f .github/human-payload.part-* .github/workflows/materialize-human.yml
      - name: Commit expanded implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize complete human player simulation"
          git push origin HEAD:agent/complete-human-player-simulation
