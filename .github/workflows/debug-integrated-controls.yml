name: Capture integrated controls source

on:
  push:
    branches: [agent/universal-football-controls]
    paths:
      - '.github/workflows/debug-integrated-controls.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/universal-football-controls
          fetch-depth: 0
      - name: Reconstruct and integrate controls
        shell: bash
        run: |
          set -euo pipefail
          RAW_PATCH="$RUNNER_TEMP/universal-controls.raw.patch"
          PATCH="$RUNNER_TEMP/universal-controls.patch"
          SOURCE="$RUNNER_TEMP/control-source"
          BASES="$RUNNER_TEMP/control-bases"
          MANIFEST="$RUNNER_TEMP/control-manifest.json"

          cat .github/control-patch/part-*.b64 | tr -d '[:space:]' | base64 --decode > "$RAW_PATCH"
          echo "8302c9cbea67f6cb201dc7e0d3c8aae25b79c0b17e3dd21dfd2203235ab1762e  $RAW_PATCH" | sha256sum --check -

          python <<'PY'
          import json, os, re
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          raw = temp / 'universal-controls.raw.patch'
          repaired = temp / 'universal-controls.patch'
          manifest = temp / 'control-manifest.json'
          output, files = [], []
          current_path = None
          in_hunk = False
          for line in raw.read_text().splitlines():
              if line.startswith('diff --git '):
                  in_hunk = False
                  match = re.match(r'diff --git a/(.+) b/(.+)', line)
                  current_path = match.group(2) if match else None
                  output.append(line); continue
              if current_path and line.startswith('index '):
                  match = re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)', line)
                  if match: files.append({'path': current_path, 'old': match.group(1), 'new': match.group(2)})
                  output.append(line); continue
              if current_path and line.startswith('new file mode '):
                  files.append({'path': current_path, 'old': '0000000', 'new': ''})
                  output.append(line); continue
              if line.startswith('@@ '):
                  in_hunk = True; output.append(line); continue
              if in_hunk and not line.startswith((' ', '+', '-', '\\')): line = ' ' + line
              elif in_hunk and line == '': line = ' '
              output.append(line)
          text = '\n'.join(output) + '\n'
          text = text.replace('requestFulscreen', 'requestFullscreen').replace('<span>B SKILL/span>', '<span>B SKILL</span>')
          repaired.write_text(text)
          deduped = {item['path']: item for item in files}
          manifest.write_text(json.dumps(list(deduped.values()), indent=2))
          PY

          git worktree add --detach "$SOURCE" origin/main
          mkdir -p "$BASES"
          SOURCE="$SOURCE" BASES="$BASES" MANIFEST="$MANIFEST" python <<'PY'
          import json, os, subprocess
          from pathlib import Path
          source = Path(os.environ['SOURCE']); bases = Path(os.environ['BASES'])
          for item in json.loads(Path(os.environ['MANIFEST']).read_text()):
              path = Path(item['path']); target = source/path; base = bases/path; old = item['old']
              target.parent.mkdir(parents=True, exist_ok=True); base.parent.mkdir(parents=True, exist_ok=True)
              if not old.strip('0'):
                  if target.exists(): target.unlink()
                  continue
              content = subprocess.check_output(['git','cat-file','blob',old], cwd=source)
              target.write_bytes(content); base.write_bytes(content)
          PY
          git -C "$SOURCE" add -A
          git -C "$SOURCE" apply --index --recount "$PATCH"
          mapfile -t CHANGED < <(git -C "$SOURCE" diff --cached --name-only)

          for path in "${CHANGED[@]}"; do
            target="$SOURCE/$path"; base_file="$BASES/$path"
            if [ ! -e "$target" ]; then rm -f "$path"; continue; fi
            mkdir -p "$(dirname "$path")"
            if [ ! -e "$base_file" ] || [ ! -e "$path" ]; then cp "$target" "$path"; continue; fi
            if [ "$path" = 'package.json' ]; then continue; fi
            ours_file="$RUNNER_TEMP/ours-${path//\//_}"; cp "$path" "$ours_file"
            git merge-file -p "$ours_file" "$base_file" "$target" > "$path" || true
          done

          python <<'PY'
          from pathlib import Path
          def unique(lines):
              seen=set(); out=[]
              for line in lines:
                  if line not in seen: seen.add(line); out.append(line)
              return out
          def renamed(lines):
              return [line.replace('setShowControlSettings','setShowUniversalControlSettings').replace('showControlSettings','showUniversalControlSettings') for line in lines]
          def resolve(path, chooser):
              file=Path(path); lines=file.read_text().splitlines(); out=[]; i=0
              while i < len(lines):
                  if not lines[i].startswith('<<<<<<<'): out.append(lines[i]); i+=1; continue
                  i+=1; ours=[]
                  while not lines[i].startswith('======='): ours.append(lines[i]); i+=1
                  i+=1; theirs=[]
                  while not lines[i].startswith('>>>>>>>'): theirs.append(lines[i]); i+=1
                  i+=1; out.extend(chooser(ours,theirs))
              file.write_text('\n'.join(out)+'\n')
          def mv(o,t):
              os='\n'.join(o); ts='\n'.join(t)
              if 'showGameSettings' in os and 'showControlSettings' in ts: return unique(o+renamed(t))
              if 'const currentDevice = useMemo' in os: return o
              if 'game-controls-overlay' in os and 'UniversalControlsOverlay' in ts: return t
              if 'setShowControlsSettings' in os and 'setShowControlSettings' in ts: return unique(o+renamed(t))
              if 'GameSettingsPanel' in os and 'ControlSettingsPanel' in ts: return unique(o+renamed(t))
              raise RuntimeError('unexpected MatchView conflict')
          def ms(o,t):
              if 'useKeyboard' in '\n'.join(o) and 'useUniversalInput' in '\n'.join(t): return unique(o+t)
              raise RuntimeError('unexpected MatchScene conflict')
          def pa(o,t):
              os='\n'.join(o); ts='\n'.join(t)
              if 'KeyboardState' in os and 'UniversalInputState' in ts: return unique(o+t)
              if 'keyboard,' in os and 'controls,' in ts: return t
              raise RuntimeError('unexpected PlayerAvatar conflict')
          resolve('src/components/MatchView.tsx', mv)
          resolve('src/game/MatchScene.tsx', ms)
          resolve('src/game/PlayerAvatar.tsx', pa)
          PY

          mkdir -p integrated-source/src/components integrated-source/src/game
          cp src/components/MatchView.tsx integrated-source/src/components/
          cp src/game/MatchScene.tsx integrated-source/src/game/
          cp src/game/PlayerAvatar.tsx integrated-source/src/game/
          nl -ba src/game/MatchScene.tsx | sed -n '430,470p'
          nl -ba src/game/PlayerAvatar.tsx | sed -n '90,125p'
      - uses: actions/upload-artifact@v4
        with:
          name: integrated-controls-source
          path: integrated-source
          retention-days: 1
