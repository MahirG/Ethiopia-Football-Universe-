name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-core-mainline:
    if: github.ref == 'refs/heads/agent/aaa-core-match-engine-mainline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aaa-core-match-engine-mainline
          fetch-depth: 0
      - name: Apply AAA core gameplay package
        shell: bash
        run: |
          if [ ! -f .github/core-v2-stage/payload.b64 ]; then
            echo "Core package already applied."
            exit 0
          fi
          base64 --decode .github/core-v2-stage/payload.b64 > /tmp/core-v2-payload.tgz
          tar -xzf /tmp/core-v2-payload.tgz -C .github/core-v2-stage
          node .github/core-v2-stage/apply.mjs
          rm -rf .github/core-v2-stage
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement mainline AAA core match gameplay engine"
          git push origin HEAD:agent/aaa-core-match-engine-mainline

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run build
