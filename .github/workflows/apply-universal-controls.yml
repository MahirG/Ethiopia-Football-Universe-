name: Apply universal football controls

on:
  push:
    branches: [agent/universal-football-controls]
    paths:
      - '.github/workflows/apply-universal-controls.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: universal-football-controls
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/universal-football-controls'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/universal-football-controls
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct and repair controls update
        run: |
          cat .github/control-patch/part-*.b64 | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/universal-controls.patch"
          echo "8302c9cbea67f6cb201dc7e0d3c8aae25b79c0b17e3dd21dfd2203235ab1762e  $RUNNER_TEMP/universal-controls.patch" | sha256sum --check -
          sed -i \
            -e 's/requestFulscreen/requestFullscreen/g' \
            -e 's#<span>B SKILL/span>#<span>B SKILL</span>#g' \
            "$RUNNER_TEMP/universal-controls.patch"
          git apply --recount --check "$RUNNER_TEMP/universal-controls.patch"
          git apply --recount "$RUNNER_TEMP/universal-controls.patch"
          rm -rf .github/control-patch
          rm -f .github/workflows/apply-universal-controls.yml
      - name: Install dependencies
        run: npm install
      - name: Validate universal controls
        run: |
          npm run input:validate
          npm run audio:validate
          npm run human:validate
          npm run world:validate
          npm run lint
          npm run build
      - name: Commit validated update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement universal cross-device football controls'
          git push origin HEAD:agent/universal-football-controls
