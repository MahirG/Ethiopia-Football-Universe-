name: Apply universal football controls

on:
  push:
    branches: [agent/universal-football-controls]
    paths:
      - '.github/workflows/apply-universal-controls.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: universal-football-controls
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/universal-football-controls'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/universal-football-controls
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct controls source and merge onto latest main
        shell: bash
        run: |
          set -euo pipefail
          RAW_PATCH="$RUNNER_TEMP/universal-controls.raw.patch"
          PATCH="$RUNNER_TEMP/universal-controls.patch"
          SOURCE="$RUNNER_TEMP/control-source"
          BASES="$RUNNER_TEMP/control-bases"
          MANIFEST="$RUNNER_TEMP/control-manifest.json"

          cat .github/control-patch/part-*.b64 | tr -d '[:space:]' | base64 --decode > "$RAW_PATCH"
          echo "8302c9cbea67f6cb201dc7e0d3c8aae25b79c0b17e3dd21dfd2203235ab1762e  $RAW_PATCH" | sha256sum --check -

          python <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          temp = Path(os.environ['RUNNER_TEMP'])
          raw = temp / 'universal-controls.raw.patch'
          repaired = temp / 'universal-controls.patch'
          manifest = temp / 'control-manifest.json'
          output: list[str] = []
          files: list[dict[str, str]] = []
          current_path: str | None = None
          in_hunk = False
          for line in raw.read_text().splitlines():
              if line.startswith('diff --git '):
                  in_hunk = False
                  match = re.match(r'diff --git a/(.+) b/(.+)', line)
                  current_path = match.group(2) if match else None
                  output.append(line)
                  continue
              if current_path and line.startswith('index '):
                  match = re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)', line)
                  if match:
                      files.append({'path': current_path, 'old': match.group(1), 'new': match.group(2)})
                  output.append(line)
                  continue
              if current_path and line.startswith('new file mode '):
                  files.append({'path': current_path, 'old': '0000000', 'new': ''})
                  output.append(line)
                  continue
              if line.startswith('@@ '):
                  in_hunk = True
                  output.append(line)
                  continue
              if in_hunk and not line.startswith((' ', '+', '-', '\\')):
                  line = ' ' + line
              elif in_hunk and line == '':
                  line = ' '
              output.append(line)
          text = '\n'.join(output) + '\n'
          text = text.replace('requestFulscreen', 'requestFullscreen')
          text = text.replace('<span>B SKILL/span>', '<span>B SKILL</span>')
          repaired.write_text(text)
          deduped: dict[str, dict[str, str]] = {}
          for item in files:
              deduped[item['path']] = item
          manifest.write_text(json.dumps(list(deduped.values()), indent=2))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git worktree add --detach "$SOURCE" origin/main
          mkdir -p "$BASES"

          SOURCE="$SOURCE" BASES="$BASES" MANIFEST="$MANIFEST" python <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          source = Path(os.environ['SOURCE'])
          bases = Path(os.environ['BASES'])
          items = json.loads(Path(os.environ['MANIFEST']).read_text())
          for item in items:
              path = Path(item['path'])
              target = source / path
              base = bases / path
              old = item['old']
              target.parent.mkdir(parents=True, exist_ok=True)
              base.parent.mkdir(parents=True, exist_ok=True)
              if not old.strip('0'):
                  if target.exists():
                      target.unlink()
                  continue
              content = subprocess.check_output(['git', 'cat-file', 'blob', old], cwd=source)
              target.write_bytes(content)
              base.write_bytes(content)
          PY

          git -C "$SOURCE" add -A
          git -C "$SOURCE" apply --index --recount "$PATCH"

          mapfile -t CHANGED < <(git -C "$SOURCE" diff --cached --name-only)
          printf 'Recovered controls files:\n%s\n' "${CHANGED[*]}"

          git merge --no-edit origin/main

          for path in "${CHANGED[@]}"; do
            target="$SOURCE/$path"
            base_file="$BASES/$path"
            if [ ! -e "$target" ]; then
              rm -f "$path"
              continue
            fi
            mkdir -p "$(dirname "$path")"
            if [ ! -e "$base_file" ] || [ ! -e "$path" ]; then
              cp "$target" "$path"
              continue
            fi
            if [ "$path" = 'package.json' ]; then
              TARGET_PACKAGE="$target" python <<'PY'
          import json
          import os
          from pathlib import Path

          current_path = Path('package.json')
          target_path = Path(os.environ['TARGET_PACKAGE'])
          current = json.loads(current_path.read_text())
          target = json.loads(target_path.read_text())
          for section in ('scripts', 'dependencies', 'devDependencies'):
              current.setdefault(section, {}).update(target.get(section, {}))
          current_path.write_text(json.dumps(current, indent=2) + '\n')
          PY
              continue
            fi
            ours_file="$RUNNER_TEMP/ours-${path//\//_}"
            cp "$path" "$ours_file"
            git merge-file -p "$ours_file" "$base_file" "$target" > "$path" || true
          done

          python <<'PY'
          from pathlib import Path
          from typing import Callable

          Lines = list[str]

          def unique(lines: Lines) -> Lines:
              seen: set[str] = set()
              result: Lines = []
              for line in lines:
                  if line not in seen:
                      seen.add(line)
                      result.append(line)
              return result

          def renamed(lines: Lines) -> Lines:
              return [
                  line.replace('setShowControlSettings', 'setShowUniversalControlSettings')
                      .replace('showControlSettings', 'showUniversalControlSettings')
                  for line in lines
              ]

          def resolve(path: str, chooser: Callable[[Lines, Lines], Lines]) -> None:
              file = Path(path)
              lines = file.read_text().splitlines()
              output: Lines = []
              index = 0
              conflicts = 0
              while index < len(lines):
                  if not lines[index].startswith('<<<<<<<'):
                      output.append(lines[index])
                      index += 1
                      continue
                  conflicts += 1
                  index += 1
                  ours: Lines = []
                  while index < len(lines) and not lines[index].startswith('======='):
                      ours.append(lines[index])
                      index += 1
                  if index >= len(lines):
                      raise RuntimeError(f'Unterminated conflict in {path}')
                  index += 1
                  theirs: Lines = []
                  while index < len(lines) and not lines[index].startswith('>>>>>>>'):
                      theirs.append(lines[index])
                      index += 1
                  if index >= len(lines):
                      raise RuntimeError(f'Unterminated conflict in {path}')
                  index += 1
                  output.extend(chooser(ours, theirs))
              if conflicts:
                  file.write_text('\n'.join(output) + '\n')
                  print(f'Resolved {conflicts} controlled overlap(s) in {path}')

          def match_view(ours: Lines, theirs: Lines) -> Lines:
              o = '\n'.join(ours)
              t = '\n'.join(theirs)
              if 'showGameSettings' in o and 'showControlSettings' in t:
                  return unique(ours + renamed(theirs))
              if 'const currentDevice = useMemo' in o:
                  return ours
              if 'game-controls-overlay' in o and 'UniversalControlsOverlay' in t:
                  return theirs
              if 'setShowControlsSettings' in o and 'setShowControlSettings' in t:
                  return unique(ours + renamed(theirs))
              if 'GameSettingsPanel' in o and 'ControlSettingsPanel' in t:
                  return unique(ours + renamed(theirs))
              raise RuntimeError(f'Unexpected MatchView overlap:\nOURS:\n{o}\nTHEIRS:\n{t}')

          def match_scene(ours: Lines, theirs: Lines) -> Lines:
              o = '\n'.join(ours)
              t = '\n'.join(theirs)
              if 'useKeyboard' in o and 'useUniversalInput' in t:
                  return unique(ours + theirs)
              raise RuntimeError(f'Unexpected MatchScene overlap:\nOURS:\n{o}\nTHEIRS:\n{t}')

          def player_avatar(ours: Lines, theirs: Lines) -> Lines:
              o = '\n'.join(ours)
              t = '\n'.join(theirs)
              if 'KeyboardState' in o and 'UniversalInputState' in t:
                  return unique(ours + theirs)
              if 'keyboard,' in o and 'controls,' in t:
                  return theirs
              raise RuntimeError(f'Unexpected PlayerAvatar overlap:\nOURS:\n{o}\nTHEIRS:\n{t}')

          resolve('src/components/MatchView.tsx', match_view)
          resolve('src/game/MatchScene.tsx', match_scene)
          resolve('src/game/PlayerAvatar.tsx', player_avatar)
          PY

          if grep -RIl --exclude-dir=.git -E '^(<<<<<<<|=======|>>>>>>>)' README.md package.json src 2>/dev/null | tee "$RUNNER_TEMP/control-conflicts.txt" | grep -q .; then
            echo 'Unresolved controls merge conflicts:'
            cat "$RUNNER_TEMP/control-conflicts.txt"
            exit 1
          fi

          rm -rf .github/control-patch
          rm -f .github/workflows/apply-universal-controls.yml
          git add -A
      - name: Install dependencies
        run: npm install
      - name: Validate universal controls
        run: |
          npm run input:validate
          npm run audio:validate
          npm run human:validate
          npm run world:validate
          npm run lint
          npm run build
      - name: Commit validated update
        run: |
          git commit -m 'Implement universal cross-device football controls'
          git push origin HEAD:agent/universal-football-controls
