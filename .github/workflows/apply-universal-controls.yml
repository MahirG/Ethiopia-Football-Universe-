name: Inspect universal football controls source

on:
  push:
    branches: [agent/universal-football-controls]
    paths:
      - '.github/workflows/apply-universal-controls.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'agent/universal-football-controls'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/universal-football-controls
          fetch-depth: 0
      - name: Reconstruct original controls source
        shell: bash
        run: |
          set -euo pipefail
          RAW_PATCH="$RUNNER_TEMP/universal-controls.raw.patch"
          PATCH="$RUNNER_TEMP/universal-controls.patch"
          SOURCE="$RUNNER_TEMP/control-source"
          MANIFEST="$RUNNER_TEMP/control-manifest.json"

          cat .github/control-patch/part-*.b64 | tr -d '[:space:]' | base64 --decode > "$RAW_PATCH"
          echo "8302c9cbea67f6cb201dc7e0d3c8aae25b79c0b17e3dd21dfd2203235ab1762e  $RAW_PATCH" | sha256sum --check -

          python <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          temp = Path(os.environ['RUNNER_TEMP'])
          raw = temp / 'universal-controls.raw.patch'
          repaired = temp / 'universal-controls.patch'
          manifest = temp / 'control-manifest.json'
          output = []
          files = []
          current_path = None
          in_hunk = False
          for line in raw.read_text().splitlines():
              if line.startswith('diff --git '):
                  in_hunk = False
                  match = re.match(r'diff --git a/(.+) b/(.+)', line)
                  current_path = match.group(2) if match else None
              elif current_path and line.startswith('index '):
                  match = re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)', line)
                  if match:
                      files.append({'path': current_path, 'old': match.group(1), 'new': match.group(2)})
              elif line.startswith('@@ '):
                  in_hunk = True
              elif in_hunk and not line.startswith((' ', '+', '-', '\\')):
                  line = ' ' + line
              elif in_hunk and line == '':
                  line = ' '
              output.append(line)
          text = '\n'.join(output) + '\n'
          text = text.replace('requestFulscreen', 'requestFullscreen')
          text = text.replace('<span>B SKILL/span>', '<span>B SKILL</span>')
          repaired.write_text(text)
          deduped = {item['path']: item for item in files}
          manifest.write_text(json.dumps(list(deduped.values()), indent=2))
          PY

          git worktree add --detach "$SOURCE" origin/main
          SOURCE="$SOURCE" MANIFEST="$MANIFEST" python <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          source = Path(os.environ['SOURCE'])
          for item in json.loads(Path(os.environ['MANIFEST']).read_text()):
              target = source / item['path']
              target.parent.mkdir(parents=True, exist_ok=True)
              if not item['old'].strip('0'):
                  if target.exists(): target.unlink()
                  continue
              target.write_bytes(subprocess.check_output(['git', 'cat-file', 'blob', item['old']], cwd=source))
          PY

          git -C "$SOURCE" apply --recount --reject --whitespace=nowarn "$PATCH" || true
          for file in src/components/MatchView.tsx src/game/CameraRig.tsx src/game/MatchScene.tsx src/game/PlayerAvatar.tsx; do
            echo "===== $file ====="
            nl -ba "$SOURCE/$file" | sed -n '1,700p'
            if [ -f "$SOURCE/$file.rej" ]; then
              echo "===== $file REJECTS ====="
              cat "$SOURCE/$file.rej"
            fi
          done
          exit 1
