name: Apply universal football controls

on:
  push:
    branches: [agent/universal-football-controls]
    paths:
      - '.github/workflows/apply-universal-controls.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: universal-football-controls
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/universal-football-controls'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/universal-football-controls
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct and apply controls update
        run: |
          mkdir -p "$RUNNER_TEMP/chunk-segments"
          for file in .github/control-patch/part-{01,02,03,06,07}.b64; do
            clean="$RUNNER_TEMP/$(basename "$file").clean"
            tr -d '[:space:]' < "$file" > "$clean"
            prefix="$RUNNER_TEMP/chunk-segments/$(basename "$file")-"
            split -b 3000 -d -a 2 "$clean" "$prefix"
            for segment in "${prefix}"*; do
              printf '%s ' "$(basename "$segment")"
              sha256sum "$segment" | cut -d' ' -f1
            done
          done
          cat .github/control-patch/part-*.b64 | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/universal-controls.patch"
          sha256sum "$RUNNER_TEMP/universal-controls.patch"
          echo "38673998c62686b9634818fc1409019d1a6cb83512101a73d7544c1634011853  $RUNNER_TEMP/universal-controls.patch" | sha256sum --check -
          git apply --check "$RUNNER_TEMP/universal-controls.patch"
          git apply "$RUNNER_TEMP/universal-controls.patch"
          rm -rf .github/control-patch
          rm -f .github/workflows/apply-universal-controls.yml
      - name: Install dependencies
        run: npm install
      - name: Validate universal controls
        run: |
          npm run input:validate
          npm run audio:validate
          npm run human:validate
          npm run world:validate
          npm run lint
          npm run build
      - name: Commit validated update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement universal cross-device football controls'
          git push origin HEAD:agent/universal-football-controls
