name: Integrate universal controls with current engine

on:
  push:
    branches: [agent/universal-football-controls]
    paths:
      - '.github/workflows/apply-universal-controls-v2.yml'

permissions:
  contents: write

concurrency:
  group: universal-football-controls-v2
  cancel-in-progress: false

jobs:
  integrate-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/universal-football-controls
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct validated controls package
        shell: bash
        run: |
          set -euo pipefail
          RAW_PATCH="$RUNNER_TEMP/universal-controls.raw.patch"
          PATCH="$RUNNER_TEMP/universal-controls.patch"
          SOURCE="$RUNNER_TEMP/control-source"
          BASES="$RUNNER_TEMP/control-bases"
          MANIFEST="$RUNNER_TEMP/control-manifest.json"

          cat .github/control-patch/part-*.b64 | tr -d '[:space:]' | base64 --decode > "$RAW_PATCH"
          echo "8302c9cbea67f6cb201dc7e0d3c8aae25b79c0b17e3dd21dfd2203235ab1762e  $RAW_PATCH" | sha256sum --check -

          python <<'PY'
          import json, os, re
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          raw = temp / 'universal-controls.raw.patch'
          repaired = temp / 'universal-controls.patch'
          manifest = temp / 'control-manifest.json'
          output, files = [], []
          current_path = None
          in_hunk = False
          for line in raw.read_text().splitlines():
              if line.startswith('diff --git '):
                  in_hunk = False
                  match = re.match(r'diff --git a/(.+) b/(.+)', line)
                  current_path = match.group(2) if match else None
                  output.append(line); continue
              if current_path and line.startswith('index '):
                  match = re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)', line)
                  if match: files.append({'path': current_path, 'old': match.group(1), 'new': match.group(2)})
                  output.append(line); continue
              if current_path and line.startswith('new file mode '):
                  files.append({'path': current_path, 'old': '0000000', 'new': ''})
                  output.append(line); continue
              if line.startswith('@@ '):
                  in_hunk = True; output.append(line); continue
              if in_hunk and not line.startswith((' ', '+', '-', '\\')): line = ' ' + line
              elif in_hunk and line == '': line = ' '
              output.append(line)
          text = '\n'.join(output) + '\n'
          text = text.replace('requestFulscreen', 'requestFullscreen')
          text = text.replace('<span>B SKILL/span>', '<span>B SKILL</span>')
          repaired.write_text(text)
          manifest.write_text(json.dumps(list({item['path']: item for item in files}.values()), indent=2))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git worktree add --detach "$SOURCE" origin/main
          mkdir -p "$BASES"

          SOURCE="$SOURCE" BASES="$BASES" MANIFEST="$MANIFEST" python <<'PY'
          import json, os, subprocess
          from pathlib import Path
          source = Path(os.environ['SOURCE']); bases = Path(os.environ['BASES'])
          for item in json.loads(Path(os.environ['MANIFEST']).read_text()):
              path = Path(item['path']); target = source/path; base = bases/path; old = item['old']
              target.parent.mkdir(parents=True, exist_ok=True); base.parent.mkdir(parents=True, exist_ok=True)
              if not old.strip('0'):
                  if target.exists(): target.unlink()
                  continue
              content = subprocess.check_output(['git','cat-file','blob',old], cwd=source)
              target.write_bytes(content); base.write_bytes(content)
          PY

          git -C "$SOURCE" add -A
          git -C "$SOURCE" apply --index --recount "$PATCH"
          mapfile -t CHANGED < <(git -C "$SOURCE" diff --cached --name-only)

          git merge --no-edit origin/main

          for path in "${CHANGED[@]}"; do
            case "$path" in
              src/game/MatchScene.tsx|src/game/PlayerAvatar.tsx|src/game/CameraRig.tsx)
                echo "Preserving current gameplay engine: $path"
                continue
                ;;
            esac
            target="$SOURCE/$path"; base_file="$BASES/$path"
            if [ ! -e "$target" ]; then rm -f "$path"; continue; fi
            mkdir -p "$(dirname "$path")"
            if [ ! -e "$base_file" ] || [ ! -e "$path" ]; then cp "$target" "$path"; continue; fi
            if [ "$path" = 'package.json' ]; then
              TARGET_PACKAGE="$target" python <<'PY'
          import json, os
          from pathlib import Path
          current_path=Path('package.json'); target_path=Path(os.environ['TARGET_PACKAGE'])
          current=json.loads(current_path.read_text()); target=json.loads(target_path.read_text())
          for section in ('scripts','dependencies','devDependencies'):
              current.setdefault(section,{}).update(target.get(section,{}))
          current_path.write_text(json.dumps(current,indent=2)+'\n')
          PY
              continue
            fi
            ours_file="$RUNNER_TEMP/ours-${path//\//_}"; cp "$path" "$ours_file"
            git merge-file -p "$ours_file" "$base_file" "$target" > "$path" || true
          done

          python <<'PY'
          from pathlib import Path
          def unique(lines):
              seen=set(); result=[]
              for line in lines:
                  if line not in seen: seen.add(line); result.append(line)
              return result
          def renamed(lines):
              return [line.replace('setShowControlSettings','setShowUniversalControlSettings').replace('showControlSettings','showUniversalControlSettings') for line in lines]
          path=Path('src/components/MatchView.tsx')
          lines=path.read_text().splitlines(); out=[]; i=0
          while i < len(lines):
              if not lines[i].startswith('<<<<<<<'): out.append(lines[i]); i+=1; continue
              i+=1; ours=[]
              while not lines[i].startswith('======='): ours.append(lines[i]); i+=1
              i+=1; theirs=[]
              while not lines[i].startswith('>>>>>>>'): theirs.append(lines[i]); i+=1
              i+=1
              o='\n'.join(ours); t='\n'.join(theirs)
              if 'showGameSettings' in o and 'showControlSettings' in t: out.extend(unique(ours+renamed(theirs)))
              elif 'const currentDevice = useMemo' in o: out.extend(ours)
              elif 'game-controls-overlay' in o and 'UniversalControlsOverlay' in t: out.extend(theirs)
              elif 'setShowControlsSettings' in o and 'setShowControlSettings' in t: out.extend(unique(ours+renamed(theirs)))
              elif 'GameSettingsPanel' in o and 'ControlSettingsPanel' in t: out.extend(unique(ours+renamed(theirs)))
              else: raise RuntimeError(f'Unexpected MatchView overlap:\nOURS:\n{o}\nTHEIRS:\n{t}')
          path.write_text('\n'.join(out)+'\n')
          PY

          if grep -RIl --exclude-dir=.git -E '^(<<<<<<<|=======|>>>>>>>)' README.md package.json src 2>/dev/null | grep -q .; then
            echo 'Unresolved merge markers remain.'
            grep -RIn --exclude-dir=.git -E '^(<<<<<<<|=======|>>>>>>>)' README.md package.json src || true
            exit 1
          fi

          rm -rf .github/control-patch
          rm -f .github/workflows/apply-universal-controls.yml
          rm -f .github/workflows/debug-integrated-controls.yml
          rm -f .github/workflows/apply-universal-controls-v2.yml
          git add -A
      - name: Install dependencies
        run: npm install
      - name: Validate all systems
        run: |
          npm run input:validate
          npm run audio:validate
          npm run human:validate
          npm run world:validate
          npm run lint
          npm run build
      - name: Commit validated integration
        run: |
          git commit -m 'Implement universal cross-device football controls'
          git push origin HEAD:agent/universal-football-controls
