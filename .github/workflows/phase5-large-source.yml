name: Assemble Phase 5 large sources

on:
  push:
    branches: [agent/phase5-final]

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]' && hashFiles('.phase5-large/READY') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase5-final
          fetch-depth: 0
      - name: Assemble audited TypeScript sources
        run: |
          cat .phase5-large/player/*.ts > src/game/PlayerAvatar.tsx
          cat .phase5-large/view/*.ts > src/components/MatchView.tsx
      - name: Install dependencies
        run: npm install
      - name: Validate complete Phase 5
        run: |
          npm run lint
          npm run build
      - name: Commit validated sources
        run: |
          rm -rf .phase5-large
          rm -f .github/workflows/phase5-large-source.yml
          rm -f .github/workflows/phase5-source-export.yml
          rm -f docs/phase5/EXPORT_TRIGGER.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete Phase 5 match integration'
          git push origin HEAD:agent/phase5-final
