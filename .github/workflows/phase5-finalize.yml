name: Finalize Phase 5

on:
  push:
    branches: [agent/phase5-final]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]' && hashFiles('.phase5-finalize') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase5-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - name: Commit clean validated tree
        run: |
          rm -rf .phase5 .phase5-large
          rm -f .phase5-finalize
          rm -f .github/workflows/phase5-finalize.yml
          rm -f .github/workflows/phase5-large-source.yml
          rm -f .github/workflows/phase5-source-export.yml
          rm -f docs/phase5/EXPORT_TRIGGER.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Phase 5 competitive match intelligence'
          git push origin HEAD:agent/phase5-final
