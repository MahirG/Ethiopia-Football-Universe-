name: Finalize kickoff transition

on:
  push:
    branches: [agent/fix-kickoff-transition-order]
    paths:
      - scripts/finalize-kickoff-transition.mjs
      - .github/workflows/finalize-kickoff-transition.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-kickoff-transition-order
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/finalize-kickoff-transition.mjs
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - name: Commit finalized transition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/MatchView.tsx
          git commit -m "Make kickoff audio non-fatal" || exit 0
          git push origin HEAD:agent/fix-kickoff-transition-order
