name: Fix human simulation lint

on:
  push:
    branches:
      - agent/complete-human-player-simulation
    paths:
      - '.github/workflows/fix-human-lint.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-human-player-simulation
          fetch-depth: 0
      - name: Apply exact lint corrections
        shell: bash
        run: |
          sed -i "s/import { HALF_LENGTH, HALF_WIDTH, PLAYER_HEIGHT } from '.\/config'/import { HALF_LENGTH, HALF_WIDTH } from '.\/config'/" src/game/PlayerAvatar.tsx
          sed -i '/const opponentProfile = humanWorld\.profiles\.get(opponentInfo\.player\.id)/d' src/game/PlayerAvatar.tsx
          sed -i 's/weatherIntensity, matchProgress, contactSide, seed/weatherIntensity, contactSide, seed/' src/human/ballContact.ts
          rm -f .github/workflows/fix-human-lint.yml
      - name: Commit lint corrections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix human simulation lint bindings"
          git push origin HEAD:agent/complete-human-player-simulation
