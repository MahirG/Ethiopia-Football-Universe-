name: Materialize living football world

on:
  push:
    branches:
      - agent/complete-living-football-world

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-living-football-world
          fetch-depth: 0
      - name: Reconstruct verified source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .world-bootstrap/part-* > /tmp/world-work.tgz
          echo "b01816defb69e910579a14565381e91474b81f8acc94fb4bb2baadc17de4f434  /tmp/world-work.tgz" | sha256sum -c -
          tar -xzf /tmp/world-work.tgz -C .
          python3 scripts/world-integrate.py
          node scripts/world-validate.mjs
          rm -rf .world-bootstrap .github/workflows/materialize-world.yml
      - name: Commit expanded implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build complete living football world"
          git push origin HEAD:agent/complete-living-football-world
